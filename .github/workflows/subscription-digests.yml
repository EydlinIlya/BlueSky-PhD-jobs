name: Operator Email Digest

# Temporary safety mode: manual dispatch only, exactly one configured recipient.
# Restore subscriber delivery only after the consent/unsubscribe rollout is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-email-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Send operator digest when new matches exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: |
          if [[ -z "$DIGEST_RECIPIENT" ]]; then
            echo "DIGEST_RECIPIENT Actions secret is required" >&2
            exit 2
          fi
          python scripts/send_subscription_digests.py --operator-to "$DIGEST_RECIPIENT"

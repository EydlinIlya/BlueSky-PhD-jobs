<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe | PhD Sky</title>
<meta name="description" content="Manage a PhD Sky weekly email alert.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  .page { width: min(100% - 32px, 620px); margin: 0 auto; padding: 48px 0 64px; }
  .crumb { margin-bottom: 28px; font-family: var(--font-mono); font-size: 13px; }
  .crumb a, footer a { color: var(--primary); text-decoration: none; }
  .crumb a:hover, footer a:hover { text-decoration: underline; }
  h1 { margin: 0 0 12px; font-family: var(--font-display); font-size: clamp(28px, 7vw, 38px); line-height: 1.15; }
  .intro { margin: 0 0 24px; color: var(--fg-muted); font-size: 16px; line-height: 1.6; }
  .card { padding: 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
  .eyebrow { margin: 0 0 10px; color: var(--fg-subtle); font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .card h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 21px; line-height: 1.3; }
  .card p { margin: 0; color: var(--fg-muted); font-size: 15px; line-height: 1.6; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .button { min-height: 44px; padding: 11px 16px; border-radius: 7px; font: 600 14px/1.3 var(--font-body); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .button-primary { border: 1px solid var(--red-600); background: var(--red-600); color: #fff; }
  .button-primary:hover { background: var(--red-500); border-color: var(--red-500); }
  .button-secondary { border: 1px solid var(--border-strong); background: transparent; color: var(--fg); }
  .button-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .button:focus-visible, a:focus-visible { outline: 3px solid var(--primary-glow); outline-offset: 3px; }
  .button[disabled] { cursor: wait; opacity: .65; }
  .status { min-height: 24px; margin-top: 14px !important; color: var(--fg-subtle) !important; font-size: 13px !important; }
  .status.error { color: var(--red-600) !important; }
  .success-mark { color: var(--green-700); }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--fg-subtle); font-family: var(--font-mono); font-size: 12px; }
  @media (max-width: 520px) {
    .page { width: min(100% - 24px, 620px); padding-top: 28px; }
    .card { padding: 20px; }
    .actions { flex-direction: column; }
    .button { width: 100%; }
  }
</style>
</head>
<body>
<main class="page">
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">&larr; PhD Sky</a></nav>
  <h1>Manage this weekly email</h1>
  <p class="intro">This link controls one saved-search alert. Your saved search and account will remain available.</p>

  <section class="card" id="unsubscribe-card" aria-labelledby="card-title">
    <p class="eyebrow">Email preference</p>
    <h2 id="card-title">Stop this weekly email?</h2>
    <p id="card-copy">Nothing changes until you confirm below. You will not need to sign in.</p>
    <div class="actions" id="actions">
      <button class="button button-primary" type="button" id="confirm-unsubscribe">Stop weekly email</button>
      <a class="button button-secondary" href="/#subscriptions">Keep email on</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <footer>
    <a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
  </footer>
</main>

<script>
  'use strict';
  const token = new URLSearchParams(window.location.search).get('token');
  const button = document.getElementById('confirm-unsubscribe');
  const statusEl = document.getElementById('status');

  function showInvalidLink() {
    document.getElementById('card-title').textContent = 'This link is incomplete';
    document.getElementById('card-copy').innerHTML = 'No email preference was changed. Open the full link from your digest, or contact <a href="mailto:eli.eydlin@gmail.com">eli.eydlin@gmail.com</a>.';
    document.getElementById('actions').innerHTML = '<a class="button button-secondary" href="/">Return to PhD Sky</a>';
  }

  if (!token) {
    showInvalidLink();
  } else {
    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Stopping email…';
      statusEl.className = 'status';
      statusEl.textContent = '';
      try {
        const response = await fetch(`/api/unsubscribe?token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'List-Unsubscribe=One-Click',
        });
        if (!response.ok) throw new Error(`unsubscribe ${response.status}`);
        document.getElementById('card-title').innerHTML = '<span class="success-mark">Weekly email stopped.</span>';
        document.getElementById('card-copy').textContent = 'This alert is now paused. You can turn it on again from Subscriptions after signing in.';
        document.getElementById('actions').innerHTML = '<a class="button button-secondary" href="/#subscriptions">Manage subscriptions</a>';
        statusEl.textContent = 'No further weekly emails will be sent for this saved search.';
      } catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent = 'Try again';
        statusEl.className = 'status error';
        statusEl.innerHTML = 'We could not update this alert. Try again, or email <a href="mailto:eli.eydlin@gmail.com">eli.eydlin@gmail.com</a>.';
      }
    });
  }
</script>
</body>
</html>

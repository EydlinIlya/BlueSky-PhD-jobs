name: Weekly Subscription Digests

# Explicitly requested saved-search alerts. A failed send advances neither the
# processing nor notification watermark, so it is safe to retry next week.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Send weekly subscription digests
        run: python scripts/send_subscription_digests.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PROVIDER: resend

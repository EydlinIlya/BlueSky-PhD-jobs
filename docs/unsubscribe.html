<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage weekly email | PhD Sky</title>
<meta name="description" content="Confirm an unsubscribe choice for a PhD Sky weekly alert.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#18594A">
<link rel="stylesheet" href="/design-tokens.css">
<link rel="stylesheet" href="/legal.css">
</head>
<body>
<main class="page" id="main">
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">&larr; PhD Sky</a></nav>
  <h1>Manage weekly email</h1>
  <div class="card">
    <p id="intro">Opening this page has not changed your email settings. Choose what you want to stop.</p>
    <div class="actions" id="unsubscribe-actions">
      <button type="button" class="button" data-scope="current">Unsubscribe this alert</button>
      <button type="button" class="button secondary" data-scope="all">Stop all weekly emails</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
  <p>You can re-enable an alert only through an explicit confirmation in <a href="/#subscriptions">Saved searches</a>.</p>
  <footer>PhD Sky · operated by Eli Eydlin in Israel<br><a href="/">Home</a> · <a href="/#subscriptions">Saved searches</a> · <a href="/privacy">Privacy</a> · <a href="mailto:eli.eydlin@gmail.com">Contact</a></footer>
</main>
<script>
(() => {
  'use strict';
  const token = new URLSearchParams(location.search).get('token') || '';
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const status = document.getElementById('status');
  const actions = document.getElementById('unsubscribe-actions');
  const buttons = [...actions.querySelectorAll('button')];

  function show(message, type) {
    status.textContent = message;
    status.className = `status ${type || ''}`;
  }

  if (!uuid.test(token)) {
    actions.hidden = true;
    show('This unsubscribe link is incomplete or invalid. No settings were changed. Contact eli.eydlin@gmail.com if you need help.', 'err');
    return;
  }

  buttons.forEach(button => button.addEventListener('click', async () => {
    buttons.forEach(item => { item.disabled = true; });
    show('Saving your choice…');
    try {
      const response = await fetch(`/api/unsubscribe?token=${encodeURIComponent(token)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope: button.dataset.scope }),
      });
      const result = await response.json();
      if (!response.ok || result.state === 'error') throw new Error('service unavailable');
      if (result.state === 'not-found') {
        actions.hidden = true;
        show('This link is invalid or the saved search no longer exists. No additional action is needed.', 'err');
      } else if (result.state === 'already-unsubscribed') {
        actions.hidden = true;
        show(button.dataset.scope === 'all' ? 'All weekly emails were already stopped.' : 'This weekly alert was already stopped.', 'ok');
      } else {
        actions.hidden = true;
        show(button.dataset.scope === 'all' ? 'All weekly emails are now stopped.' : 'This weekly alert is now stopped.', 'ok');
      }
    } catch (error) {
      buttons.forEach(item => { item.disabled = false; });
      show('We could not save the change. Try again, or email eli.eydlin@gmail.com for help.', 'err');
    }
  }));
})();
</script>
</body>
</html>

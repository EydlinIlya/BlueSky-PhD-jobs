name: Operator Email Digest

# Testing allowlist only: configured operator profiles, never all subscribers.
on:
  schedule:
    # 09:00 UTC daily. Scheduled workflows run from the default branch.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-email-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Send allowlisted digests when new matches exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS || secrets.DIGEST_RECIPIENT }}
        run: |
          if [[ -z "$DIGEST_RECIPIENTS" ]]; then
            echo "DIGEST_RECIPIENTS Actions secret is required" >&2
            exit 2
          fi
          python scripts/send_subscription_digests.py --operator-to "$DIGEST_RECIPIENTS"

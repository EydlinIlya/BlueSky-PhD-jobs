name: Daily Job Board Update

# Ingests new Bluesky posts into Supabase and regenerates the static
# frontend snapshot (positions.json + SEO pages). Ingestion runs 4x/day; the
# static site is regenerated only on the 05:00 UTC run to avoid retaining four
# large Vercel production deployments every day. Manual non-recovery runs also
# regenerate the site.

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Recovery mode: ignore the stored timestamp and re-fetch recent search results"
        required: true
        default: false
        type: boolean
      fetch_limit:
        description: "Results per Bluesky query (1-100; use 100 for recovery)"
        required: true
        default: "50"
        type: string
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC
    - cron: "0 11 * * *"  # 11:00 UTC
    - cron: "0 17 * * *"  # 17:00 UTC
    - cron: "0 23 * * *"  # 23:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Stage 1 - Fetch posts
        env:
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
          FETCH_LIMIT: ${{ inputs.fetch_limit || '50' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if ! [[ "$FETCH_LIMIT" =~ ^[0-9]+$ ]] || (( FETCH_LIMIT < 1 || FETCH_LIMIT > 100 )); then
            echo "fetch_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          args=(--storage supabase --stage fetch --limit "$FETCH_LIMIT")
          if [[ "$FULL_SYNC" == "true" ]]; then
            args+=(--full-sync)
          fi
          python bluesky_search.py "${args[@]}"

      - name: Stage 2 - Filter (LLM classification)
        run: python bluesky_search.py --storage supabase --stage filter
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Stage 3 - Deduplicate
        run: python bluesky_search.py --storage supabase --stage dedup
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Stage 4 - Publish
        run: python bluesky_search.py --storage supabase --stage publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Generate daily frontend and SEO pages
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.full_sync) }}
        run: python scripts/generate_seo_pages.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit and push daily frontend and SEO updates
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.full_sync) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update SEO content (daily)"
          # Prefer the locally-regenerated docs/ files when rebasing onto a
          # newer remote (Supabase regen output is the source of truth).
          # Without this, conflicts in positions.json/sitemap.xml caused by
          # parallel manual pushes abort the rebase and the run fails.
          git pull --rebase --strategy-option=theirs
          git push
